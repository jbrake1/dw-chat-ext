<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Mock Gemini</title>
<style>body{font-family:system-ui;margin:0;display:flex}nav{width:180px;border-right:1px solid #ccc;padding:8px}main{flex:1;padding:16px}
.ql-editor{min-height:40px;border:1px solid #888;padding:4px}.hidden{display:none}</style></head>
<body>
<!-- Mock of gemini.google.com (best-effort mimic of the public DOM, NOT verified against the live site):
     side nav New chat, top bar model picker + Upgrade, input-area-v2 > uploader ("+") + rich-textarea (.ql-editor) + send-button,
     user-query / model-response turns, message-content .markdown, code-block with a .code-block-decoration header.
     Query: speed, tokens, (2026 UI: the "Upload & tools" menu has NO file input; its "Upload files" item creates one and calls input.click(), which the extension's page hook answers. Without the hook only drop/paste work), menu=0 (no "+" input at all), limit=1,
     attach=0 (uploads silently ignored), signedout=1, code=0 (no code blocks), convo=1 (start on an old conversation at /app/abc123). -->
<nav>
  <side-nav-action-button data-test-id="new-chat-button"><a href="/app" aria-label="New chat"><mat-icon>edit_square</mat-icon><span>New chat</span></a></side-nav-action-button>
  <div><a href="/library">Library</a></div>
</nav>
<main>
  <top-bar-actions>
    <button class="model-picker" aria-label="Open mode picker" data-test-id="bard-mode-menu-button"><span>Hydrogen</span><mat-icon>arrow_drop_down</mat-icon></button>
    <button class="upgrade" aria-label="Upgrade to Google AI Ultra">Upgrade</button>
    <a class="get-app" href="#app">Get app</a>
  </top-bar-actions>
  <div id="chat-history" class="chat-history"></div>
  <input-area-v2>
    <div class="file-preview-container" id="previews"></div>
    <xap-uploader-dropzone id="dropzone">
      <uploader id="uploader"><button class="upload-card-button" aria-label="Upload &amp; tools" aria-haspopup="menu" aria-expanded="false"><mat-icon>add</mat-icon></button></uploader>
      <rich-textarea><div class="ql-editor ql-blank textarea" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Enter a prompt for Gemini" data-placeholder="Ask Gemini"><p><br></p></div></rich-textarea>
    </xap-uploader-dropzone>
    <div class="send-button-container"><button class="send-button" aria-label="Send message" aria-disabled="true"><mat-icon>send</mat-icon></button></div>
    <button class="speech_dictation_mic_button" aria-label="Microphone"><mat-icon>mic</mat-icon></button>
  </input-area-v2>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  // jsdom has no blob URLs: a tiny stand-in so the ?chips=1 download button behaves like a browser's.
  if (!URL.createObjectURL) { var __blobs = {}, __n = 0; URL.createObjectURL = function (b) { var u = 'blob:' + location.origin + '/b' + (++__n); __blobs[u] = b; return u; }; window.__blobUrls = __blobs; }
  var SPEED = Number(q.get('speed') || 20), NTOK = Number(q.get('tokens') || 20);
  var NOATTACH = q.get('attach') === '0', NOINPUT = false, NOMENU = q.get('menu') === '0', LIMIT = q.get('limit') === '1', SIGNEDOUT = q.get('signedout') === '1', CODE = q.get('code') !== '0', NOREPLY = q.get('noreply') === '1', SEED = q.get('seed') === 'page';
  window.__received = []; window.__forbidden = []; window.__menuOpened = 0; window.__newChat = 0;
  var hist = document.getElementById('chat-history'), previews = document.getElementById('previews');
  var prompt = document.querySelector('.ql-editor'), send = document.querySelector('.send-button'), uploader = document.getElementById('uploader');
  var files = [], uploading = false, streaming = false, timer = null;

  document.querySelector('.model-picker').addEventListener('click', function () { window.__forbidden.push('model'); });
  document.querySelector('.upgrade').addEventListener('click', function () { window.__forbidden.push('upgrade'); });
  document.querySelector('.get-app').addEventListener('click', function (e) { e.preventDefault(); window.__forbidden.push('getapp'); });
  if (SIGNEDOUT) { var s = document.createElement('a'); s.href = 'https://accounts.google.com/ServiceLogin?continue=https://gemini.google.com/app'; s.setAttribute('aria-label', 'Sign in'); s.textContent = 'Sign in'; document.querySelector('top-bar-actions').appendChild(s); }
  if (q.get('convo') === '1') {
    history.replaceState(null, '', '/app/abc123' + location.search);
    hist.innerHTML = '<user-query><div class="query-text">old question</div></user-query><model-response><message-content class="model-response-text"><div class="markdown markdown-main-panel"><p>old answer</p></div></message-content></model-response>';
  }
  if (SEED || /\/app\/tokr15recover\/?$/.test(location.pathname)) {
    hist.innerHTML = '<user-query><div class="query-text">Please update the page</div></user-query><model-response><message-content class="model-response-text"><div class="markdown markdown-main-panel"><p>File: /index.html</p><code-block><div class="code-block-decoration"><span>html</span></div><pre><code>&lt;!doctype html&gt;\n&lt;html&gt;&lt;body&gt;&lt;h1&gt;Recovered TOK-R15&lt;/h1&gt;&lt;/body&gt;&lt;/html&gt;</code></pre></code-block><p>That is all. TOK-R15</p></div></message-content></model-response>';
    if (SEED && window.history) history.replaceState(null, '', '/app/tokr15recover' + location.search);
  }
  document.querySelector('[data-test-id=new-chat-button] a').addEventListener('click', function (e) {
    e.preventDefault(); window.__newChat++;
    setTimeout(function () { hist.textContent = ''; history.pushState(null, '', '/app' + location.search); }, 50);
  });

  function text() { return (prompt.textContent || '').trim(); }
  function refresh() {
    var off = streaming || uploading || (!text() && !files.length);
    send.setAttribute('aria-disabled', off ? 'true' : 'false'); send.disabled = off;
    prompt.classList.toggle('ql-blank', !text());
  }
  prompt.addEventListener('input', refresh);
  prompt.addEventListener('paste', function (e) {
    var cd = e.clipboardData; if (!cd) return;
    if (cd.files && cd.files.length) { e.preventDefault(); addFiles(Array.prototype.slice.call(cd.files)); return; }
    var t = cd.getData('text/plain'); if (t) { e.preventDefault(); prompt.textContent = t; prompt.dispatchEvent(new Event('input', { bubbles: true })); }
  });
  var dz = document.getElementById('dropzone');
  dz.addEventListener('dragover', function (e) { e.preventDefault(); });
  dz.addEventListener('drop', function (e) { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files.length) addFiles(Array.prototype.slice.call(e.dataTransfer.files)); });

  // "Upload & tools" menu (2026 UI, from public reports): there is NO file input on the page. The visible "Upload files" item
  // creates a detached <input type=file>, hooks its change event and calls input.click() (the OS file chooser).
  // A hidden decoy button sits next to it in the same wrapper.
  uploader.querySelector('button').addEventListener('click', function () {
    if (NOMENU) return;
    window.__menuOpened++;
    if (uploader.querySelector('.menu')) return;
    var m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu');
    m.innerHTML = '<images-files-uploader data-test-id="uploader-images-files-button-advanced"><button class="hidden-local-file-image-selector-button hidden" aria-hidden="true">decoy</button><button role="menuitem" aria-label="Upload files. Documents, data, code files"><span>Upload files</span></button></images-files-uploader><button role="menuitem">Add from Drive</button><button role="menuitem">Photos</button><button role="menuitem" aria-label="Import code">Import code</button>';
    m.querySelector('.hidden-local-file-image-selector-button').addEventListener('click', function () { window.__forbidden.push('decoy-button'); });
    m.querySelector('images-files-uploader button[role=menuitem]').addEventListener('click', function () {
      window.__chooserCalls = (window.__chooserCalls || 0) + 1;
      var inp = document.createElement('input'); inp.type = 'file'; inp.multiple = true;
      inp.addEventListener('change', function () { addFiles(Array.prototype.slice.call(inp.files)); });
      inp.click();
      m.remove();
    });
    uploader.appendChild(m);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { var m = uploader.querySelector('.menu'); if (m) m.remove(); } });

  function addFiles(list) {
    if (NOATTACH) return;                                                         // ?attach=0: Gemini silently ignores every upload
    uploading = true; refresh();
    setTimeout(function () {
      list.forEach(function (f) {
        files.push(f);
        var c = document.createElement('uploader-file-preview');
        c.innerHTML = '<div class="file-preview"><span class="name"></span><button aria-label="Remove file"><mat-icon>close</mat-icon></button></div>';
        c.querySelector('.name').textContent = f.name; previews.appendChild(c);
      });
      uploading = false; refresh();
    }, 200);
  }
  send.addEventListener('click', doSend);
  prompt.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); } });

  function doSend() {
    if (send.disabled) return;
    var t = text(), fs = files.slice();
    window.__received.push({ text: t, files: fs.map(function (f) { return { name: f.name, size: f.size, type: f.type }; }) });
    var u = document.createElement('user-query'); u.innerHTML = '<div class="query-text"></div>'; u.firstChild.textContent = t; hist.appendChild(u);
    prompt.innerHTML = '<p><br></p>'; files = []; previews.textContent = '';
    streaming = true; refresh();
    if (window.history) history.pushState(null, '', '/app/c' + Date.now().toString(16) + location.search);
    if (NOREPLY) { streaming = false; refresh(); return; }                         // ?noreply=1: the send is accepted but no visible reply or Stop button (for recovery tests)
    send.classList.add('stop'); send.setAttribute('aria-label', 'Stop response'); send.disabled = false; send.removeAttribute('aria-disabled');
    var mr = document.createElement('model-response');
    setTimeout(function () {
      mr.innerHTML = '<model-thoughts><button>Show thinking</button></model-thoughts><div class="response-container"><message-content class="model-response-text"><div class="markdown markdown-main-panel"><p></p></div></message-content></div>';
      hist.appendChild(mr);
      var md = mr.querySelector('.markdown'), p = md.querySelector('p');
      if (LIMIT) { p.textContent = 'You\u2019ve reached your limit for uploads. Your limit resets tomorrow.'; return finish(); }
      var words = ['OK.', 'Gemini', 'got', 'your', 'request', '(' + t.length + ' chars)', 'with', fs.length + ' files' + (fs.length ? ' (first: ' + fs[0].name + ').' : '.')];
      for (var i = words.length; i < NTOK; i++) words.push('word' + i);
      var k = 0, out = '';
      timer = setInterval(function () {
        out += (k ? ' ' : '') + words[k++]; p.textContent = out;
        if (k >= words.length) { clearInterval(timer); timer = null; if (CODE) code(md); finish(); }
      }, SPEED);
    }, 250);
    function rawHtml(md2, whole) {                                                // ?reply=rawdoc|rawfrag: the model wrote HTML into ordinary paragraphs (no code block)
      var lp = document.createElement('p'); lp.innerHTML = 'File: <code></code>'; lp.querySelector('code').textContent = '/index.html'; md2.appendChild(lp);
      var src = whole
        ? ['<!doctype html>', '<html lang="en"><head><meta charset="utf-8"><title>New title for the page</title></head>', '<body>', '<h1 id="top">Family owned since 1998</h1>', '<p class="fine">Earlier previews remain available: <a href="a.zip">a.zip</a> (md5 <code>0123456789abcdef0123456789abcdef</code>)</p>', '<div class="wrap"><h2 id="install">Install it in Chrome</h2></div>', '</body>', '</html>']
        : ['<p class="fine preview-note">Earlier previews remain available: <a href="a.zip">a.zip</a> (md5 <code>0123456789abcdef0123456789abcdef</code>), <a href="b.zip">b.zip</a></p>', '<p class="fine preview-note">Prefer a walkthrough? Email <a href="mailto:support@example.com">support@example.com</a>.</p>', '<div class="wrap">', '<h2 id="install">Install it in Chrome</h2>', '<div class="install-block"><ol><li>Open chrome://extensions</li><li>Turn on Developer mode</li></ol></div>', '</div>'];
      src.forEach(function (line) { var p = document.createElement('p'); p.textContent = line; md2.appendChild(p); });
      var tail = document.createElement('p'); tail.textContent = 'That is all.'; md2.appendChild(tail);
    }
    function code(md2) {
      var RAW = q.get('reply');
      if (RAW === 'rawdoc' || RAW === 'rawfrag') return rawHtml(md2, RAW === 'rawdoc');
      var add = function (label, lang, body) {
        var lp = document.createElement('p'); lp.innerHTML = 'File: <code></code>'; lp.querySelector('code').textContent = label; md2.appendChild(lp);
        var cb = document.createElement('code-block');
        cb.innerHTML = '<div class="code-block ng-star-inserted"><div class="code-block-decoration header-formatted gds-title-s"><span></span><div class="buttons"><button aria-label="Copy code"><mat-icon>content_copy</mat-icon></button></div></div>' +
          '<div class="formatted-code-block-internal-container"><div class="animated-opacity"><pre><code role="text" data-test-id="code-content" class="code-container formatted"></code></pre></div></div></div>';
        cb.querySelector('.code-block-decoration span').textContent = lang;
        cb.querySelector('code').textContent = body; md2.appendChild(cb);
      };
      if (q.get('reply') === 'taro') {                                            // v0.1.12: the page links two pictures the model made
        add('/index.html', 'HTML', '<!doctype html>\n<html><body><h1>Family owned since 1998</h1><picture><source type="image/webp" srcset="assets/img/hanalei-taro-1600.webp"><img src="assets/img/hanalei-taro-1600.jpg" alt="Taro"></picture></body></html>\n');
        var tp = document.createElement('p'); tp.textContent = 'Save the new image to /assets/img/hanalei-taro-1600.webp and /assets/img/hanalei-taro-1600.jpg.'; md2.appendChild(tp);
        return;
      }
      if (q.get('reply') === 'family') {                                          // v0.1.14: James's case — missing webp source, generated jpeg fallback
        add('/index.html', 'HTML', '<!doctype html>\n<html><body><picture><source type="image/webp" srcset="assets/img/family-working-at-home.webp"><img src="assets/img/Gemini_Generated_Image_a1b2c3d4e5f6.jpeg" alt="Family working at home"></picture></body></html>\n');
        var fp = document.createElement('p'); fp.textContent = 'I added a generated photo.'; md2.appendChild(fp);
        return;
      }
      add('/index.html', 'HTML', '<!doctype html>\n<html><body><h1>Family owned since 1998</h1></body></html>\n');
      add('/css/site.css', 'CSS', 'h1{color:#1f4d2b}\n');
      var tail = document.createElement('p'); tail.textContent = 'That is all.'; md2.appendChild(tail);
    }
    send.onclick = function () { if (!streaming) return; if (timer) { clearInterval(timer); timer = null; } finish(); };
    function finish() {
      streaming = false; send.classList.remove('stop'); send.setAttribute('aria-label', 'Send message'); send.onclick = null; refresh();
      // v0.1.12 (?chips=1): files the model "made with code", shown as download chips under the reply (best-effort mimic).
      if (q.get('chips') === '1') {
        var box = document.createElement('div'); box.className = 'attachment-container generated-files';
        var family = q.get('reply') === 'family';
        box.innerHTML = family
          ? '<div class="file-tile"><span class="file-name">Gemini_Generated_Image_a1b2c3d4e5f6.jpeg</span><button class="dl" aria-label="Download file"><mat-icon fonticon="download">download</mat-icon></button></div>'
          : ('<div class="file-tile"><span class="file-name">hanalei-taro-1600.webp</span><button class="dl" aria-label="Download file"><mat-icon fonticon="download">download</mat-icon></button></div>' +
          '<div class="file-tile"><span class="file-name">hanalei-taro-1600.jpg</span><a class="open" href="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQ==">Open</a></div>' +
          '<div class="file-tile"><span class="file-name">notes.txt</span><button aria-label="Share notes.txt">share</button></div>');
        var mdx = mr.querySelector('.markdown');
        mdx.parentNode.appendChild(box);
        var tag = document.createElement('p'); tag.textContent = '[file-tag: code-generated-file-2-1795450470]'; mdx.appendChild(tag);
        box.querySelector('button.dl').addEventListener('click', function () {
          window.__downloads = (window.__downloads || 0) + 1;
          var bytes, type, name;
          if (family) { bytes = new Uint8Array([0xFF,0xD8,0xFF,0xE0,0,0x10,0x4A,0x46,0,0,0,0,0,0,0,0]); type = 'image/jpeg'; name = 'Gemini_Generated_Image_a1b2c3d4e5f6.jpeg'; }
          else { bytes = new Uint8Array([0x52,0x49,0x46,0x46,0x10,0,0,0,0x57,0x45,0x42,0x50,0x56,0x50,0x38,0x20,1,2,3,4]); type = 'image/webp'; name = 'hanalei-taro-1600.webp'; }
          var u = URL.createObjectURL(new Blob([bytes], { type: type }));
          var a = document.createElement('a'); a.href = u; a.download = name; a.click();
        });
      }
      var acts = document.createElement('message-actions'); acts.innerHTML = '<button aria-label="Good response">up</button><button aria-label="Share &amp; export">share</button><button aria-label="Copy">copy</button>';
      mr.appendChild(acts);
    }
  }
  refresh();
})();
</script></body></html>
